<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page needs nothing from any network, so it is not allowed to reach one: this blocks requests,
     fonts and frames even if a string in the state tried to smuggle one in, and lets images come only
     from the page's own folder (a file, or the page's own origin when it is served). Scripts are left
     alone so the live board can load state.js from beside itself. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; img-src 'self' file:; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<title>Logbook</title>
<style>
/* Colour tokens. Light is the default; dark is defined twice, once for a viewer whose system is dark
   and who has not asked for light, and once for a viewer who asked for dark. */
:root {
  color-scheme: light;
  --bg: #f6f6f4;
  --surface: #ffffff;
  --fg: #1d1d1f;
  --muted: #5d5d64;
  --border: #dcdcd7;
  --soft: #efefeb;
  --ok: #1b6a33;
  --bad: #ad2319;
  --bad-bg: #fcecea;
  --bad-line: #e2a29b;
  --warn: #874d00;
  --warn-bg: #fdf3e1;
  --warn-line: #e5c48c;
  --link: #1c52ad;
  --accent: #2f64c8;
  --accent-ink: #ffffff;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --fs: 15px;
  --line: 1.5;
  --gap: 12px;
  --pad: 14px;
}
:root[data-density="compact"] {
  --fs: 14px;
  --line: 1.4;
  --gap: 6px;
  --pad: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141416;
    --surface: #1c1c1f;
    --fg: #ececef;
    --muted: #a4a4ad;
    --border: #34343a;
    --soft: #26262a;
    --ok: #7fd494;
    --bad: #ff9187;
    --bad-bg: #3a1c19;
    --bad-line: #7a3a33;
    --warn: #f1b560;
    --warn-bg: #33270f;
    --warn-line: #6e5323;
    --link: #8fb5ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141416;
  --surface: #1c1c1f;
  --fg: #ececef;
  --muted: #a4a4ad;
  --border: #34343a;
  --soft: #26262a;
  --ok: #7fd494;
  --bad: #ff9187;
  --bad-bg: #3a1c19;
  --bad-line: #7a3a33;
  --warn: #f1b560;
  --warn-bg: #33270f;
  --warn-line: #6e5323;
  --link: #8fb5ff;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: var(--line);
}
.wrap { max-width: 56rem; margin: 0 auto; padding: 20px 16px 48px; }
a { color: var(--link); }
code, pre, .mono { font-family: var(--mono); font-size: 0.92em; }
button {
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  min-height: 30px;
  cursor: pointer;
}
button:hover { border-color: var(--muted); }
/* Focus is drawn in the text colour, not the accent, so it stays visible whatever accent a board sets. */
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
button:focus:not(:focus-visible) { outline: none; }

/* Header */
.top { margin-bottom: 18px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 0.86em; letter-spacing: 0.02em; }
.modes { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.modes button { border: 0; border-radius: 0; min-height: 28px; padding: 2px 10px; font-size: 0.86em; background: var(--surface); }
.modes button + button { border-left: 1px solid var(--border); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
h1 { font-size: 1.9em; letter-spacing: -0.01em; line-height: 1.25; margin: 8px 0 8px; overflow-wrap: anywhere; }
h1.from-prompt {
  font-size: 1.2em;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 0; color: var(--muted); font-size: 0.92em; }
.meta time { color: var(--fg); }
.badge { display: inline-block; border-radius: 999px; padding: 2px 12px; font-size: 0.92em; font-weight: 600; border: 1px solid var(--border); color: var(--fg); background: var(--soft); overflow-wrap: anywhere; }
.badge.live { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge.finished { color: var(--ok); }
.notice { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--fg); }
.notice strong { color: var(--warn); }

/* Summary tiles: one per tab, and the panel of the one chosen below them. */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 var(--gap); }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-height: 44px;
}
.tile[aria-selected="true"] { border: 2px solid var(--fg); padding: 13px 15px; }
.tile-label { color: var(--muted); font-size: 0.9em; font-weight: 500; }
.tile-big { font-size: 2.1em; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-sub { color: var(--muted); font-size: 0.88em; }
.tile.bad .tile-sub { color: var(--bad); font-weight: 600; }
.pane { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px var(--pad) var(--pad); margin: 0 0 var(--gap); }
.pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0 4px; }
.pane-head h2 { margin: 0; font-size: 1.15em; }
.commit-row { display: grid; grid-template-columns: 7ch minmax(0, 1fr) 12ch 9ch; gap: 4px 16px; align-items: baseline; }
.commit-row .hash, .commit-row .branch { font-family: var(--mono); font-size: 0.88em; color: var(--muted); }
.commit-row .when { text-align: right; color: var(--muted); font-size: 0.92em; }
@media (max-width: 640px) {
  .commit-row { grid-template-columns: 7ch minmax(0, 1fr); }
  .commit-row .branch, .commit-row .when { grid-column: 2; text-align: left; }
}

/* Sections */
.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 0 0 var(--gap); }
.sec h2 { margin: 0; font-size: 1em; }
.toggle {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: 0; background: transparent; border-radius: 10px;
  padding: calc(var(--pad) - 4px) var(--pad); text-align: left; font-weight: 650;
}
.chev { display: inline-block; width: 1em; color: var(--muted); transition: transform 0.15s ease; }
.toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.count { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 0.9em; }
.body { padding: 0 var(--pad) var(--pad); }
.sec-needs { border-color: var(--warn-line); }
.sec-stuck { border-color: var(--bad-line); }
.list { list-style: none; margin: 0; padding: 0; }
.item { padding: var(--gap) 0; border-top: 1px solid var(--soft); overflow-wrap: anywhere; }
.list > .item:first-child { border-top: 0; padding-top: 2px; }
.item p { margin: 0; }
.sub { color: var(--muted); font-size: 0.9em; }
.tag { font-family: var(--mono); font-size: 0.85em; color: var(--muted); margin-right: 6px; }
/* The margin keeps a word longer than the column, such as a command's result, off the text after it. */
.status { display: inline-block; min-width: 7.5em; margin-right: 6px; font-size: 0.88em; font-weight: 600; white-space: nowrap; }
.s-ok { color: var(--ok); }
.s-bad { color: var(--bad); }
.s-warn { color: var(--warn); }
.s-active { color: var(--fg); }
.s-muted { color: var(--muted); font-weight: 400; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 6px 0 0; font-size: 0.93em; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
@media (max-width: 480px) {
  .facts { grid-template-columns: 1fr; }
  .facts dd { margin-bottom: 4px; }
  .status { min-width: 0; margin-right: 6px; white-space: normal; overflow-wrap: anywhere; }
}
.cmd {
  margin: 6px 0 0; padding: 6px 8px; border-radius: 6px; background: var(--soft);
  white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; overflow-x: auto;
}

/* Needs you: an open question, and a hard stop, which the task is actually blocked on. */
.q .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 2px; }
.qid { font-family: var(--mono); font-weight: 700; }
.q-text { font-weight: 550; }
.copyrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.copied { color: var(--muted); font-size: 0.9em; }
.q.hard {
  background: var(--bad-bg); border: 1px solid var(--bad-line); border-radius: 8px;
  padding: var(--gap) 12px; margin-bottom: var(--gap);
}
.list > .q.hard:first-child { padding-top: var(--gap); }
.q.hard + .q { border-top: 0; }
.flag { color: var(--bad); font-weight: 700; font-size: 0.88em; letter-spacing: 0.02em; }

.group-title { margin: 12px 0 2px; font-size: 0.9em; font-weight: 650; color: var(--muted); overflow-wrap: anywhere; }
.group-title:first-child { margin-top: 0; }
.subtoggle { margin-top: 10px; font-size: 0.9em; }
.agent-meta { display: flex; flex-wrap: wrap; gap: 0 12px; font-variant-numeric: tabular-nums; }
.agent-meta .dur { min-width: 7.5em; text-align: right; }
.agent-meta .tok { min-width: 6em; text-align: right; }
.agent-meta .ids { font-family: var(--mono); font-size: 0.95em; }
.gates { list-style: none; margin: 4px 0 0; padding: 0; font-size: 0.9em; }
.foot { margin-top: 24px; color: var(--muted); font-size: 0.86em; }
.foot-facts { margin: 24px 0 0; color: var(--muted); font-size: 0.92em; overflow-wrap: anywhere; }
.foot-facts + .foot { margin-top: 6px; }
.empty { color: var(--muted); }

/* The lede: the board's own few sentences on what exists now, under the title. */
.lede { margin: 14px 0 0; font-size: 1.08em; max-width: 46rem; white-space: pre-line; overflow-wrap: anywhere; }

/* A section with nothing to fold: What it looks like, and Rulings. */
.block-head { display: flex; align-items: baseline; gap: 8px; padding: calc(var(--pad) - 4px) var(--pad); font-weight: 650; }

/* What it looks like: each image with its caption, tall ones cut off at the top part. */
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.shot { margin: 0; min-width: 0; }
.shot img {
  display: block; width: 100%; height: auto; max-height: 560px; object-fit: cover; object-position: top;
  border: 1px solid var(--border); border-radius: 10px; background: var(--soft);
}
.shot figcaption { margin-top: 6px; color: var(--muted); font-size: 0.9em; overflow-wrap: anywhere; }

/* Rulings: every call, ticked to keep it. An unticked one is marked to reverse. */
.rhint { margin: 0 0 6px; }
.rgroup {
  margin: 16px 0 4px; font-family: var(--mono); font-size: 0.78em; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere;
}
.rulings { list-style: none; margin: 0; padding: 0; }
.rule + .rule { margin-top: 2px; }
.ruling {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; align-items: start;
  padding: 10px; border: 1px solid transparent; border-radius: 8px; cursor: pointer;
}
.ruling:hover { background: var(--soft); }
.ruling.reversed { background: var(--warn-bg); border-color: var(--warn-line); }
.rtick { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
.rtext { min-width: 0; overflow-wrap: anywhere; }
.rtext > span { display: block; }
.rid { font-family: var(--mono); font-size: 0.88em; color: var(--muted); margin-right: 6px; }
.rtitle { font-weight: 650; }
.yours {
  display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--fg); font-size: 0.8em; font-weight: 600; vertical-align: 1px;
}
.rmark { margin-left: 6px; color: var(--warn); font-weight: 700; }
.rmark[hidden] { display: none; }
.rwhy { margin-top: 2px; }
.rif { margin-top: 2px; color: var(--muted); font-size: 0.92em; }
.rif strong { font-weight: 650; }
.note-label { display: block; margin: 16px 0 4px; font-weight: 600; }
.answers-note {
  display: block; width: 100%; min-height: 4.5em; font: inherit; color: inherit; background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; resize: vertical;
}
/* The answers bar stays at the foot of the window while anything above it is read. */
.answerbar {
  position: sticky; bottom: 8px; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  margin: 0 0 var(--gap); padding: 10px var(--pad); background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 2px 14px rgba(0, 0, 0, 0.12);
}
.copy-answers { min-height: 44px; padding: 6px 16px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
.answers-line {
  flex: 1 1 16rem; min-width: 0; margin: 0; font-family: var(--mono); font-size: 0.86em;
  overflow-wrap: anywhere; -webkit-user-select: text; user-select: text;
}
.answerbar .copied:empty { display: none; }
.answerbar .copied { flex-basis: 100%; }

/* The record: the tiles, below everything the viewer acts on. */
.record-head { margin: 28px 0 10px; }
.record-head h2 { margin: 0; font-size: 1.15em; }
.record-head p { margin: 2px 0 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* Print: the report on paper, light, with every section open and nothing to press. */
@media print {
  :root, :root[data-theme] {
    color-scheme: light;
    --bg: #ffffff !important; --surface: #ffffff !important; --fg: #000000 !important;
    --muted: #444444 !important; --border: #bbbbbb !important; --soft: #e6e6e6 !important;
    --ok: #000000 !important; --bad: #000000 !important; --bad-bg: #ffffff !important;
    --bad-line: #000000 !important; --warn: #000000 !important; --warn-bg: #ffffff !important;
    --warn-line: #888888 !important; --link: #000000 !important;
    --accent: #ffffff !important; --accent-ink: #000000 !important;
  }
  body { font-size: 10.5pt; }
  .wrap { max-width: none; padding: 0; }
  .modes, .copyrow, .subtoggle, .chev { display: none !important; }
  .body[hidden], .subbody[hidden], .pane[hidden] { display: block !important; }
  .tiles { display: none !important; }
  .pane { border: 0; border-top: 1px solid var(--border); border-radius: 0; padding-left: 0; padding-right: 0; }
  .sec { border: 0; border-top: 1px solid var(--border); border-radius: 0; }
  .toggle { padding-left: 0; padding-right: 0; }
  .body { padding-left: 0; padding-right: 0; }
  .item, .q.hard, .ruling, .shot { break-inside: avoid; }
  .answerbar { display: none !important; }
  .ruling:hover { background: transparent; }
  .shot img { max-height: 360px; }
  a[href]::after { content: " (" attr(href) ")"; }
}
</style>
<!-- logbook:state -->
<script>
/* Everything that decides what the page says lives in PB as pure functions of (state, clock), with no
   DOM, so the tests can run them under node. The drawing code below them is the only part that
   touches the document, and it only ever writes state strings as text, never as markup. */
var PB = (function () {
  'use strict';

  var MODES = ['light', 'dark', 'system'];

  // Only entries that are objects: a null or a bare value in a list a recorder wrote badly is dropped
  // rather than crashing the build partway through.
  function list(state, key) {
    var arr = state && Array.isArray(state[key]) ? state[key] : [];
    return arr.filter(function (x) { return x !== null && typeof x === 'object' && !Array.isArray(x); });
  }

  function str(value) {
    return value === null || value === undefined ? '' : String(value);
  }

  function parseTime(value) {
    return typeof value === 'string' ? Date.parse(value) : NaN;
  }

  function positive(value, fallback) {
    return typeof value === 'number' && isFinite(value) && value > 0 ? value : fallback;
  }

  // A coarse span for ages: seconds only while they matter, then minutes, hours, days.
  function formatSpan(ms) {
    if (!isFinite(ms)) return '';
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + ' s';
    var m = Math.floor(s / 60);
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60);
    if (h < 24) return m % 60 ? h + ' h ' + (m % 60) + ' min' : h + ' h';
    var d = Math.floor(h / 24);
    return d === 1 ? '1 day' : d + ' days';
  }

  // A timestamp ahead of the browser's clock is clock skew, not the future, so it reads as just now.
  function formatAge(ms) {
    if (!isFinite(ms)) return '';
    if (ms < 5000) return 'just now';
    return formatSpan(ms) + ' ago';
  }

  // A duration keeps its seconds under an hour, where they are still worth reading.
  function formatDuration(ms) {
    if (!isFinite(ms)) return '';
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + ' s';
    var m = Math.floor(s / 60);
    if (m < 60) return s % 60 ? m + ' min ' + (s % 60) + ' s' : m + ' min';
    return formatSpan(ms);
  }

  // A token count short enough to scan: 950, 12.3k, 4.2M. Nothing where the count was not recorded.
  function formatTokens(n) {
    if (typeof n !== 'number' || !isFinite(n) || n < 0) return '';
    if (n < 1000) return n + ' tok';
    if (n < 1e6) return (n / 1e3).toFixed(n < 1e5 ? 1 : 0).replace(/\.0$/, '') + 'k tok';
    return (n / 1e6).toFixed(n < 1e7 ? 2 : 1).replace(/\.?0+$/, '') + 'M tok';
  }

  function totalTokens(state) {
    // Each count is one context's peak size, so the agents' figure is the largest, never a sum: a sum would
    // count the same context again on every turn and every agent.
    var agents = list(state, 'agents').reduce(function (top, a) { return typeof a.tokens === 'number' ? Math.max(top, a.tokens) : top; }, 0);
    var main = typeof state.tokens === 'number' ? state.tokens : 0;
    return { main: main, agents: agents };
  }

  var TAB_IDS = ['built', 'changed', 'verified', 'commands', 'agents'];

  // The summary tiles, one per tab that has something in it: a big number and what it counts.
  function tiles(state, now) {
    var shown = sections(state, now);
    var out = [];
    TAB_IDS.forEach(function (id) {
      if (shown.indexOf(id) < 0) return;
      var t = { id: id, bad: false };
      if (id === 'built') {
        var nd = builtDeliverables(state).length;
        t.label = 'Built'; t.big = String(list(state, 'commits').length);
        t.sub = 'commits · ' + nd + (nd === 1 ? ' deliverable' : ' deliverables');
      } else if (id === 'changed') {
        var nf = changedFiles(state).length;
        t.label = 'Changed'; t.big = String(nf); t.sub = nf === 1 ? 'file' : 'files';
      } else if (id === 'verified') {
        var v = verifiedCount(state).match(/^(\d+) ?(.*)$/);
        t.label = 'Verified'; t.big = v ? v[1] : '0'; t.sub = v ? v[2] : '';
        t.bad = /fail/.test(t.sub);
      } else if (id === 'commands') {
        var rest = otherCommands(state);
        var failed = rest.filter(function (c) { return c.result === 'fail'; }).length;
        t.label = 'Commands'; t.big = String(rest.length);
        t.sub = failed ? failed + ' failed' : (rest.length === 1 ? 'command' : 'commands');
        t.bad = failed > 0;
      } else {
        var all = list(state, 'agents');
        var running = all.filter(function (a) { return a.outcome === 'running'; }).length;
        var tok = formatTokens(totalTokens(state).agents);
        t.label = 'Agents'; t.big = String(all.length);
        t.sub = (running ? running + ' running' : 'all finished') + (tok ? ' · largest ' + tok : '');
      }
      out.push(t);
    });
    return out;
  }

  function agentDuration(agent, now) {
    var start = parseTime(agent && agent.started);
    var end = agent && agent.ended ? parseTime(agent.ended) : now;
    return isFinite(start) && isFinite(end) ? end - start : NaN;
  }

  function isOpen(question) {
    return question && question.status !== 'answered';
  }

  // Hard stops first, because the task is blocked on them; otherwise the order they were asked.
  function openQuestions(state) {
    var open = list(state, 'questions').filter(isOpen);
    return open.filter(function (q) { return q.hardStop === true; })
      .concat(open.filter(function (q) { return q.hardStop !== true; }));
  }

  function answeredQuestions(state) {
    return list(state, 'questions').filter(function (q) { return q && q.status === 'answered'; });
  }

  // The board's own summary: the lede under the title, and the facts line in the footer. A board written
  // before there was one has none.
  function summaryOf(state) {
    var s = state && state.summary;
    if (!s || typeof s !== 'object' || Array.isArray(s)) return null;
    var text = typeof s.text === 'string' ? s.text.trim() : '';
    var facts = typeof s.facts === 'string' ? s.facts.trim() : '';
    return text || facts ? { text: text, facts: facts } : null;
  }

  // An image is shown only from a plain relative path inside the board folder. Nothing with a scheme or
  // a drive (any colon), nothing absolute, no step up (`..`), no backslash, which a URL reads as a slash,

  // A collapsible section: a real button in the heading, aria-expanded, and a body that stays
  // collapsed across re-renders because the choice lives in ui.collapsed, not in the DOM.
  function section(id, title, count, body) {
    if (ui.pane) {
      // In the tab strip's panel a section is its heading and body, with nothing to fold.
      var pane = el('div', 'pane pane-' + id);
      pane.id = 'b-' + id;
      pane.setAttribute('role', 'tabpanel');
      pane.setAttribute('aria-labelledby', 'tab-' + id);
      pane.hidden = ui.tab !== id;
      body.className = 'body';
      return add(pane, add(el('div', 'pane-head'), el('h2', null, title), count ? el('span', 'count', count) : null), body);
    }
    var sec = el('section', 'sec sec-' + id);
    sec.setAttribute('aria-labelledby', 'h-' + id);
    var h2 = el('h2');
    h2.id = 'h-' + id;
    var open = !ui.collapsed[id];
    var btn = el('button', 'toggle');
    btn.type = 'button';
    btn.setAttribute('data-key', 'toggle-' + id);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-controls', 'b-' + id);
    var chev = el('span', 'chev', '▾');
    chev.setAttribute('aria-hidden', 'true');
    add(btn, chev, el('span', null, title), count ? el('span', 'count', count) : null);
    body.id = 'b-' + id;
    body.className = 'body';
    body.hidden = !open;
    btn.addEventListener('click', function () {
      ui.collapsed[id] = !ui.collapsed[id];
      btn.setAttribute('aria-expanded', String(!ui.collapsed[id]));
      body.hidden = !!ui.collapsed[id];
    });
    return add(sec, add(h2, btn), body);
  }

  /* Clipboard. A file:// page is not always given the clipboard API, so a hidden textarea and
     execCommand stand in for it. */

  function copy(text, button, done) {
    function fallback() {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.setAttribute('aria-hidden', 'true');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(area);
      button.focus();
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else {
      fallback();
    }
  }

  // A section with nothing to fold, for what the viewer reads and acts on rather than looks up.
  function block(id, title, count, body) {
    var sec = el('section', 'sec sec-' + id);
    sec.setAttribute('aria-labelledby', 'h-' + id);
    var h2 = el('h2', 'block-head');
    h2.id = 'h-' + id;
    add(h2, el('span', null, title), count ? el('span', 'count', count) : null);
    body.id = 'b-' + id;
    body.className = 'body';
    return add(sec, h2, body);
  }

  // Copy answers puts the line on the clipboard where the browser allows it. A page opened from a file
  // is often refused the clipboard, so then the line is selected for the viewer to copy themselves.
  function copyAnswers(text, line, said) {
    function say(words) {
      said.textContent = words;
      window.setTimeout(function () { if (said.textContent === words) said.textContent = ''; }, 6000);
    }
    function select() {
      try {
        var range = document.createRange();
        range.selectNodeContents(line);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      } catch (e) { /* the line is still there to select by hand */ }
      var mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
      say('Selected. Copy it with ' + (mac ? '⌘C' : 'Ctrl+C') + '.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say('Copied. Paste it into the chat.'); }, select);
    } else {
      select();
    }
  }

  // One ruling: a row whose tick keeps the call, with its code, title, whose call it was, why, and what
  // reversing it would mean. Unticking it marks it to reverse.
  function rulingRow(item, now, changed) {
    var kept = !PB.isReversed(ui.ticks, item.id);
    var row = el('label', 'ruling' + (kept ? '' : ' reversed'));
    var box = el('input', 'rtick');
    box.type = 'checkbox';
    box.checked = kept;
    box.setAttribute('data-key', 'tick-' + item.id);
    box.setAttribute('data-ruling', item.id);
    var mark = el('span', 'rmark', '· reverse');
    mark.hidden = kept;
    var yours = item.yours ? el('span', 'yours', 'yours') : null;
    if (yours) yours.title = 'You made this call';
    var text = add(el('span', 'rtext'),
      add(el('span', 'rhead'), el('span', 'rid', item.id), el('span', 'rtitle', item.title), yours, mark));
    if (item.why) add(text, el('span', 'rwhy', item.why));
    if (item.reverse) add(text, add(el('span', 'rif'), el('strong', null, 'If reversed:'), ' ' + item.reverse));
    if (item.revised) add(text, add(el('span', 'rif'), 'Revised ', when(item.revised, now)));
    box.addEventListener('change', function () {
      if (box.checked) delete ui.ticks[item.id]; else ui.ticks[item.id] = false;
      row.className = 'ruling' + (box.checked ? '' : ' reversed');
      mark.hidden = box.checked;
      saveAnswers();
      changed();
    });
    return add(el('li', 'rule'), add(row, box, text));
  }

  function question(q, now) {
    var hard = q.hardStop === true;
    var item = el('li', 'item q' + (hard ? ' hard' : ''));
    var head = add(el('div', 'head'), el('span', 'qid', q.id));
    if (hard) add(head, el('span', 'flag', '■ Blocked until you answer'));
    if (q.asked) add(head, add(el('span', 'sub'), 'asked ', ticking(q.asked, 'age', now)));
    add(item, head, el('p', 'q-text', q.text));
    add(item, facts([
      ['Running on', q['default']],
      ['Affects', q.affects],
      ['To reverse', q.reverse]
    ]));
    var line = PB.copyText(q);
    var row = el('div', 'copyrow');
    var btn = el('button', 'copy', 'Copy “' + line.trim() + '”');
    btn.type = 'button';
    btn.setAttribute('data-key', 'copy-' + PB.str(q.id));
    btn.setAttribute('aria-label', 'Copy ' + line.trim() + ' to the clipboard, then type your answer after it in the chat');
    var note = el('span', 'copied');
    note.setAttribute('role', 'status');
    btn.addEventListener('click', function () {
      copy(line, btn, function (ok) {
        note.textContent = ok ? 'Copied. Paste it into the chat and type your answer after it.'
          : 'Could not copy. Type ' + line.trim() + ' in the chat, then your answer.';
        window.setTimeout(function () { note.textContent = ''; }, 6000);
      });
    });
    return add(item, add(row, btn, note));
  }

  function commitItem(c, now) {
    var item = el('li', 'item commit-row');
    return add(item, el('code', 'hash', PB.shortHash(c.hash)), el('span', 'msg', c.subject),
      el('code', 'branch', c.branch || ''), c.time ? add(el('span', 'when'), when(c.time, now)) : el('span', 'when'));
  }

  function deliverableItem(d, now, key) {
    // The label leads; a path, and a url, follow as text unless the heading already says it. A url
    // that is not a web link is only ever that text.
    var title = PB.str(d.label || d.path || d.url);
    var item = el('li', 'item');
    add(item, add(el('p'), link(d.url, title, key) || el('span', null, title)));
    if (d.path && d.path !== title) add(item, el('p', 'sub mono', d.path));
    if (d.url && d.url !== title) add(item, el('p', 'sub mono', d.url));
    if (d.time) add(item, add(el('p', 'sub'), 'recorded ', when(d.time, now)));
    return item;
  }

  function agentIds(parent, ids) {
    ids.forEach(function (id, i) { add(parent, i ? ', ' : '', el('code', null, PB.str(id).slice(0, 8))); });
    return parent;
  }

  function changeItem(f, now) {
    var item = el('li', 'item');
    add(item, add(el('p'), f.created === true ? el('span', 'tag', 'new') : null, el('span', 'mono', f.path)));
    var sub = el('p', 'sub');
    var counts = PB.changeCounts(f).join(' · ');
    if (counts) add(sub, counts);
    if (f.last) add(sub, (counts ? ' · ' : '') + 'changed ', when(f.last, now), ' (', ticking(f.last, 'age', now), ')');
    var agents = Array.isArray(f.agents) ? f.agents.filter(function (a) { return a; }) : [];
    if (agents.length) add(sub, (sub.childNodes.length ? ' · ' : '') + (agents.length === 1 ? 'by agent ' : 'by agents '));
    agentIds(sub, agents);
    return add(item, sub.childNodes.length ? sub : null);
  }

  // A command as a row: its result in words, what it was for, the command itself, and how often.
  function commandItem(c, now, tag) {
    var item = el('li', 'item');
    add(item, add(el('p'), statusNode(PB.commandStatus(c)), tag ? el('span', 'tag', tag) : null,
      c.description ? el('span', null, c.description) : null));
    add(item, add(el('pre', 'cmd'), el('code', null, c.command)));
    var sub = el('p', 'sub');
    var runs = PB.runsText(c);
    if (runs) add(sub, runs);
    if (c.time) add(sub, (runs ? ' · last ran ' : 'ran '), when(c.time, now), ' (', ticking(c.time, 'age', now), ')');
    return add(item, sub.childNodes.length ? sub : null);
  }

  /* The page, built fresh from the state into a detached node, then swapped in. If building throws,
     the old page stays. */

  function build(state, now) {
    var wrap = el('div', 'wrap');
    if (!state) {
      add(wrap, add(el('header', 'top'), add(el('div', 'top-row'), el('p', 'eyebrow', 'Logbook'), modes())),
        el('h1', null, 'Waiting for the board'),
        el('p', 'empty', frozen ? 'This report carries no state.'
          : 'state.js has not been read yet. The page tries again every few seconds.'));
      return wrap;
    }

    document.title = (PB.str(state.title) || 'Logbook') + (frozen ? ' — report' : ' — logbook');
    if (PB.schemaMismatch(state)) {
      var mismatch = el('p', 'notice');
      mismatch.setAttribute('role', 'status');
      mismatch.textContent = 'This board was written by a different version of the plugin, and may not be shown correctly.';
      add(wrap, mismatch);
    }
    add(wrap, header(state, now));

    var shown = PB.sections(state, now);
    var main = el('main');
    var tabs = shown.filter(function (id) { return PB.TAB_IDS.indexOf(id) >= 0; });
    if (tabs.indexOf(ui.tab) < 0) ui.tab = tabs[0] || null;
    function tabStrip() {
      if (!tabs.length) return;
      add(main, add(el('div', 'record-head'), el('h2', null, 'The record'),
        el('p', 'sub', 'What was built, changed, checked and run, for reference.')));
      var strip = el('div', 'tiles');
      strip.setAttribute('role', 'tablist');
      strip.setAttribute('aria-label', 'Detail');
      PB.tiles(state, now).forEach(function (t) {
        var b = el('button', 'tile' + (t.bad ? ' bad' : ''));
        b.type = 'button';
        b.id = 'tab-' + t.id;
        b.setAttribute('role', 'tab');
        b.setAttribute('data-key', 'tab-' + t.id);
        b.setAttribute('aria-selected', String(ui.tab === t.id));
        b.setAttribute('aria-controls', 'b-' + t.id);
        add(b, el('span', 'tile-label', t.label), el('span', 'tile-big', t.big), el('span', 'tile-sub', t.sub));
        b.addEventListener('click', function () { ui.tab = t.id; render(); });
        add(strip, b);
      });
      add(main, strip);
      // Every panel is drawn and all but the chosen one hidden, so a printed report holds them all.
      ui.pane = true;
      try { tabs.forEach(function (id) { add(main, SECTIONS[id](state, now)); }); } finally { ui.pane = false; }
    }
    // Needs you, What it looks like, Rulings, Stuck and Steps lead; then the record: the tiles and the
    // panel of the one chosen.
    shown.forEach(function (id) {
      if (PB.TAB_IDS.indexOf(id) < 0) add(main, SECTIONS[id](state, now));
    });
    tabStrip();
    var summary = PB.summaryOf(state);
    if (!shown.length && !(summary && summary.text)) add(main, el('p', 'empty', 'Nothing recorded yet.'));
    add(wrap, main);

    if (summary && summary.facts) add(wrap, el('p', 'foot-facts', summary.facts));
    var foot = el('p', 'foot', 'Times are shown in your local time; the board records them in UTC.' +
      (frozen ? ' This report is a snapshot and does not refresh.' : ''));
    if (ui.loadError && !frozen) add(foot, ' The last attempt to read state.js failed, so this is the last state it read.');
    return add(wrap, foot);
  }

  function modes() {
    var box = el('div', 'modes');
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', 'Colour mode');
    var current = applyTheme().mode;
    [['light', 'Light'], ['dark', 'Dark'], ['system', 'System']].forEach(function (m) {
      var b = el('button', null, m[1]);
      b.type = 'button';
      b.setAttribute('data-key', 'mode-' + m[0]);
      b.setAttribute('aria-pressed', String(current === m[0]));
      b.addEventListener('click', function () {
        ui.chosen = m[0];
        writeStored(m[0]);
        render();
      });
      box.appendChild(b);
    });
    return box;
  }

  function header(state, now) {
    var top = el('header', 'top');
    add(top, add(el('div', 'top-row'), el('p', 'eyebrow', frozen ? 'Progress report' : 'Logbook'), modes()));
    var title = el('h1', state.titleSource === 'prompt' ? 'from-prompt' : null, PB.str(state.title) || 'Untitled task');
    if (state.titleSource === 'prompt') title.title = PB.str(state.title);
    add(top, title);
    var s = PB.statusOf('board', state.state);
    var meta = el('p', 'meta');
    add(meta, add(el('span', 'badge ' + s.cls), s.glyph + ' ' + s.word));
    if (state.started && state.state !== 'finished') add(meta, add(el('span'), 'Started ', when(state.started, now), ' (', ticking(state.started, 'age', now), ')'));
    if (state.state === 'finished' && state.updated) {
      var span = PB.parseTime(state.updated) - PB.parseTime(state.started);
      add(meta, add(el('span'), 'Completed ', when(state.updated, now), isFinite(span) ? ' · ' + PB.formatDuration(span) : ''));
    } else if (state.updated) {
      add(meta, add(el('span'), 'Updated ', when(state.updated, now), ' (', ticking(state.updated, 'age', now), ')'));
    }
    var tt = PB.totalTokens(state);
    if (tt.main > 0 || tt.agents > 0) {
      var tk = add(el('span'), 'Context ', PB.formatTokens(tt.main || tt.agents).replace(' tok', ''));
      tk.title = 'Peak context: main session ' + (PB.formatTokens(tt.main) || 'unknown') + ', largest agent ' +
        (PB.formatTokens(tt.agents) || 'unknown') + '. The size of one context, not tokens used over time.';
      add(meta, tk);
    }
    add(top, meta);
    var summary = PB.summaryOf(state);
    if (summary && summary.text) add(top, el('p', 'lede', summary.text));
    if (PB.isStale(state, now, frozen)) {
      var notice = el('p', 'notice');
      notice.setAttribute('role', 'status');
      add(notice, el('strong', null, '⚠︎ No event for '), ticking(state.updated, 'age', now),
        '. The task may be busy, waiting on something, or over.');
      add(top, notice);
    }
    return top;
  }

  var SECTIONS = {
    needs: function (state, now) {
      var open = PB.openQuestions(state);
      var ul = el('ul', 'list');
      open.forEach(function (q) { add(ul, question(q, now)); });
      var hard = open.filter(function (q) { return q.hardStop === true; }).length;
      return section('needs', 'Needs you', hard ? hard + ' blocking, ' + open.length + ' open' : open.length + ' open', add(el('div'), ul));
    },

    looks: function (state) {
      var grid = el('div', 'shots');
      var shown = 0;
      PB.gallery(state).forEach(function (d) {
        var src = PB.imageSrc(d.image);
        if (!src) return;
        var caption = PB.str(d.label || d.path);
        var img = el('img');
        img.alt = caption;
        img.decoding = 'async';
        img.src = src;
        add(grid, add(el('figure', 'shot'), img, caption ? el('figcaption', null, caption) : null));
        shown++;
      });
      return block('looks', 'What it looks like', shown === 1 ? '1 image' : shown + ' images', add(el('div'), grid));
    },

    // The rulings, then the note, then the bar that copies both as one line. The bar is the section's
    // sibling, so it stays at the foot of the window over everything above it, not only the rulings.
    rulings: function (state, now) {
      loadAnswers(state);
      var groups = PB.rulings(state);
      var line = el('p', 'answers-line');
      line.id = 'answers-line';
      function changed() { line.textContent = PB.answersLine(state, ui.ticks, ui.note); }
      var body = el('div');
      add(body, el('p', 'sub rhint', 'Ticked means keep. Untick any call you want reversed, add a note if you like, ' +
        'then copy your answers into the chat.'));
      var count = 0;
      groups.forEach(function (g) {
        // The ungrouped have a heading only when there are groups to set them apart from.
        var name = g.name !== null ? g.name : groups.length > 1 ? 'Other' : null;
        if (name) add(body, el('h3', 'rgroup', name));
        var ul = el('ul', 'rulings');
        g.items.forEach(function (item) { add(ul, rulingRow(item, now, changed)); count++; });
        add(body, ul);
      });
      var label = el('label', 'note-label', 'Note');
      label.htmlFor = 'answers-note';
      var area = el('textarea', 'answers-note');
      area.id = 'answers-note';
      area.rows = 3;
      area.value = ui.note;
      area.placeholder = 'Anything to add (optional)';
      area.setAttribute('data-key', 'answers-note');
      area.addEventListener('input', function () { ui.note = area.value; saveAnswers(); changed(); });
      add(body, label, area);

      var bar = el('div', 'answerbar');
      bar.setAttribute('role', 'region');
      bar.setAttribute('aria-label', 'Your answers');
      var btn = el('button', 'copy-answers', 'Copy answers');
      btn.type = 'button';
      btn.setAttribute('data-key', 'copy-answers');
      btn.setAttribute('aria-describedby', 'answers-line');
      var said = el('span', 'copied');
      said.setAttribute('role', 'status');
      btn.addEventListener('click', function () { copyAnswers(line.textContent, line, said); });
      changed();
      add(bar, btn, line, said);

      var both = document.createDocumentFragment();
      return add(both, block('rulings', 'Rulings', count === 1 ? '1 call' : count + ' calls', body), bar);
    },

    stuck: function (state, now) {
      var result = PB.stuck(state, now);
      var ul = el('ul', 'list');
      result.items.forEach(function (it) {
        var li = el('li', 'item');
        if (it.kind === 'step') {
          add(li, add(el('p'), add(el('span', 'status s-warn'), el('span', null, '⚠︎'), ' quiet'),
            el('span', 'tag', 'Step ' + it.id), el('span', null, it.text)));
          add(li, add(el('p', 'sub'), 'In progress with no event for ', ticking(it.since, 'span', now),
            ' (the threshold is ' + PB.formatSpan(1000 * ((state.settings && state.settings.stuckAfterSeconds) || 600)) + ').'));
        } else if (it.kind === 'check') {
          add(li, add(el('p'), status('check', 'fail'), el('span', 'tag', 'Check ' + it.id), el('span', null, it.text)));
          if (it.command) add(li, add(el('pre', 'cmd'), el('code', null, it.command)));
        } else if (it.kind === 'test') {
          add(li, add(el('p'), statusNode(PB.commandStatus({ result: 'fail', exit: it.exit })), el('span', 'tag', 'Test'),
            it.text ? el('span', null, it.text) : null));
          add(li, add(el('pre', 'cmd'), el('code', null, it.command)));
        } else {
          add(li, add(el('p'), status('agent', 'failed'), el('span', 'tag', 'Agent'), el('span', null, it.text || it.id)));
        }
        add(ul, li);
      });
      return section('stuck', result.title, String(result.items.length), add(el('div'), ul));
    },

    steps: function (state, now) {
      var steps = PB.list(state, 'steps');
      var ol = el('ol', 'list');
      steps.forEach(function (step) {
        var li = el('li', 'item');
        add(li, add(el('p'), status('step', step.status), el('span', 'tag', step.id), el('span', null, step.subject)));
        if (step.status === 'in_progress' && step.updated) {
          add(li, add(el('p', 'sub'), 'last event ', ticking(step.updated, 'age', now)));
        }
        add(ol, li);
      });
      var done = steps.filter(function (s) { return s.status === 'completed'; }).length;
      return section('steps', 'Steps', done + ' of ' + steps.length + ' done', add(el('div'), ol));
    },

    built: function (state, now) {
      var body = el('div');
      PB.builtGroups(state).forEach(function (g) {
        add(body, el('h3', 'group-title', g.step ? 'Step ' + PB.str(g.step.id) + ' · ' + PB.str(g.step.subject) : 'Not tied to a step'));
        var ul = el('ul', 'list');
        g.commits.forEach(function (c) { add(ul, commitItem(c, now)); });
        g.deliverables.forEach(function (d, i) { add(ul, deliverableItem(d, now, PB.linkKey(g.step, i))); });
        add(body, ul);
      });
      var nc = PB.list(state, 'commits').length;
      var nd = PB.builtDeliverables(state).length;
      return section('built', 'Built', nc + (nc === 1 ? ' commit, ' : ' commits, ') + nd + (nd === 1 ? ' deliverable' : ' deliverables'), body);
    },

    changed: function (state, now) {
      var files = PB.changedFiles(state);
      var ul = el('ul', 'list');
      files.forEach(function (f) { add(ul, changeItem(f, now)); });
      return section('changed', 'Changed', files.length + (files.length === 1 ? ' file' : ' files'), add(el('div'), ul));
    },

    verified: function (state, now) {
      var ul = el('ul', 'list');
      PB.verifiedRows(state).forEach(function (row) {
        var c = row.item;
        if (row.kind === 'test') {
          add(ul, commandItem(c, now, 'Test'));
          return;
        }
        var li = el('li', 'item');
        add(li, add(el('p'), status('check', c.result), el('span', 'tag', c.id), el('span', null, c.proves)));
        if (c.command) add(li, add(el('pre', 'cmd'), el('code', null, c.command)));
        var sub = el('p', 'sub');
        if (c.time) add(sub, 'ran ', when(c.time, now), ' (', ticking(c.time, 'age', now), ')');
        if (c.agent) add(sub, (c.time ? ', ' : '') + 'by agent ', el('code', null, PB.str(c.agent).slice(0, 8)));
        if (sub.childNodes.length) add(li, sub);
        add(ul, li);
      });
      return section('verified', 'Verified', PB.verifiedCount(state), add(el('div'), ul));
    },

    commands: function (state, now) {
      var commands = PB.otherCommands(state);
      var body = el('div');
      var note = PB.commandsNote(state);
      if (note) add(body, el('p', 'sub', note));
      var ul = el('ul', 'list');
      commands.forEach(function (c) { add(ul, commandItem(c, now, null)); });
      var failed = commands.filter(function (c) { return c.result === 'fail'; }).length;
      return section('commands', 'Commands', commands.length + (commands.length === 1 ? ' command' : ' commands') +
        (failed ? ', ' + failed + ' failed' : ''), add(body, ul));
    },

    agents: function (state, now) {
      var agents = PB.orderedAgents(state);
      var ul = el('ul', 'list');
      agents.forEach(function (a) {
        var li = el('li', 'item');
        add(li, add(el('p'), status('agent', a.outcome), el('span', null, a.description || a.type || 'Agent')));
        var sub = el('p', 'sub agent-meta');
        // The type is named here only when the heading is not already the type.
        var bits = [a.description ? a.type : null, a.model, PB.str(a.id).slice(0, 8)].filter(function (x) { return x; }).join(' · ');
        var dur = el('span', 'dur');
        if (a.outcome === 'running' && !a.ended) {
          add(dur, ticking(a.started, 'duration', now));
        } else {
          add(dur, PB.formatDuration(PB.agentDuration(a, now)));
        }
        var tok = el('span', 'tok', PB.formatTokens(a.tokens));
        add(sub, dur, tok, bits ? el('span', 'ids', bits) : null);
        add(li, sub);
        var gates = PB.list(a, 'gates');
        if (gates.length) {
          var gl = el('ul', 'gates');
          gates.forEach(function (g) {
            add(gl, add(el('li'), status('check', g.result), el('span', 'tag', g.id), el('span', null, g.text)));
          });
          add(li, gl);
        }
        add(ul, li);
      });
      var running = agents.filter(function (a) { return a.outcome === 'running'; }).length;
      return section('agents', 'Agents', running + ' running, ' + (agents.length - running) + ' finished', add(el('div'), ul));
    }
  };

  /* Rendering in place. The whole page is rebuilt only when the state, or what the clock makes of it,
     changes; otherwise only the ages move. The scroll position and the focused control survive. */

  function shape(state, now) {
    if (!state) return 'none';
    return JSON.stringify([
      PB.stuck(state, now).items.map(function (i) { return i.kind + ':' + i.id; }),
      PB.isStale(state, now, frozen),
      ui.loadError,
      new Date(now).toDateString()
    ]);
  }

  // A build that throws leaves the page showing something rather than nothing: the old page, with a
  // notice, if there was one; a short message of its own, if this is the first draw.
  function buildFailed(app) {
    if (app.firstChild) {
      if (!document.getElementById('pb-build-error')) {
        var notice = el('p', 'notice');
        notice.id = 'pb-build-error';
        notice.setAttribute('role', 'status');
        notice.textContent = 'The latest state could not be drawn. Showing what was last shown.';
        app.insertBefore(notice, app.firstChild);
      }
    } else {
      app.appendChild(el('p', 'empty', 'This board could not be drawn. The state file may be from a different version.'));
    }
  }

  function render() {
    var state = board();
    var now = Date.now();
    var app = document.getElementById('pb-app');
    if (!app) return;
    var fresh;
    try { fresh = build(state, now); } catch (e) { buildFailed(app); return; }
    var active = document.activeElement;
    var focused = active && active.getAttribute ? active.getAttribute('data-key') : null;
    // A note being typed keeps its caret and its own scroll, not only its focus.
    var caret = active && active.tagName === 'TEXTAREA' ? [active.selectionStart, active.selectionEnd, active.scrollTop] : null;
    var x = window.scrollX, y = window.scrollY;
    while (app.firstChild) app.removeChild(app.firstChild);
    app.appendChild(fresh);
    window.scrollTo(x, y);
    if (focused) {
      var keyed = app.querySelectorAll('[data-key]');
      for (var i = 0; i < keyed.length; i++) {
        if (keyed[i].getAttribute('data-key') !== focused) continue;
        keyed[i].focus({ preventScroll: true });
        if (caret && keyed[i].tagName === 'TEXTAREA') {
          keyed[i].setSelectionRange(caret[0], caret[1]);
          keyed[i].scrollTop = caret[2];
        }
        break;
      }
    }
    ui.json = state ? JSON.stringify(state) : null;
    ui.shape = shape(state, now);
  }

  function tick() {
    var state = board();
    var now = Date.now();
    var json = state ? JSON.stringify(state) : null;
    if (json !== ui.json || shape(state, now) !== ui.shape) {
      applyTheme();
      render();
      return;
    }
    var nodes = document.querySelectorAll('[data-since]');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      n.textContent = format(n.getAttribute('data-fmt'), now - PB.parseTime(n.getAttribute('data-since')));
    }
  }

  // A fresh script tag every refreshSeconds, the previous one removed. A failed load keeps the last
  // state on screen.
  function refresh() {
    var prev = document.getElementById('pb-state');
    if (prev && prev.parentNode) prev.parentNode.removeChild(prev);
    var tag = document.createElement('script');
    tag.id = 'pb-state';
    tag.src = 'state.js?t=' + Date.now();
    tag.onload = function () { ui.loadError = false; tick(); schedule(); };
    tag.onerror = function () { ui.loadError = true; tick(); schedule(); };
    document.head.appendChild(tag);
  }
  function schedule() {
    var state = board();
    window.setTimeout(refresh, 1000 * PB.refreshSeconds(state && state.settings));
  }

  document.addEventListener('DOMContentLoaded', function () {
    applyTheme();
    render();
    window.setInterval(tick, 1000);
    if (!frozen) schedule();
  });
})();
</script>
</head>
<body>
<div id="pb-app"></div>
</body>
</html>
